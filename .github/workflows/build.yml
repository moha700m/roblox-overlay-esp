name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Ninja)
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build\rbx-esp.exe dist\
          Copy-Item src\rbx.ini dist\
          Compress-Archive -Path dist\* -DestinationPath rbx-esp-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbx-esp-win64
          path: rbx-esp-win64.zip
          retention-days: 90

      - name: Publish nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>$null
          gh release create nightly dist\rbx-esp.exe dist\rbx.ini rbx-esp-win64.zip `
            --title "Nightly build $(Get-Date -Format yyyy-MM-dd)" `
            --notes "Automated build from latest commit. Download rbx-esp-win64.zip, extract, run rbx-esp.exe as Administrator while Roblox is running."
